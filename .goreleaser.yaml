version: 2

# goreleaser config for lfg.
#
# Builds:  darwin/amd64, darwin/arm64, linux/amd64, linux/arm64
# Outputs: tar.gz archives + GitHub release + (optional) Homebrew tap formula
#
# Tagged release flow (assumes a tag like `v0.1.0`):
#   1. `git tag v0.1.0 && git push --tags`
#   2. CI runs `goreleaser release --clean` (.github/workflows/release.yml)
#   3. Artifacts upload to github.com/ptmaroct/lfg/releases/v0.1.0
#
# Local snapshot (no tag, no upload):
#   make release-snapshot
#
# Versions baked in via -ldflags so `lfg version --verbose` works without
# embedded build metadata files.

project_name: lfg

before:
  hooks:
    - go mod tidy

builds:
  - id: lfg
    main: ./cmd/lfg
    binary: lfg
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ptmaroct/lfg/internal/version.Version={{.Version}}
      - -X github.com/ptmaroct/lfg/internal/version.Commit={{.ShortCommit}}
      - -X github.com/ptmaroct/lfg/internal/version.BuildDate={{.Date}}

archives:
  - id: lfg
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# Two formulae publish to the same tap (ptmaroct/homebrew-tap):
#
#   lfg      → stable channel; written on tags like v0.3.2
#   lfg-beta → preview channel; written on prerelease tags like
#              v0.4.0-beta.1 (driven by the develop branch +
#              release-please-config-beta.json).
#
# `skip_upload: auto` skips the stable formula on snapshots/prereleases.
# The lfg-beta formula uses an inverse template so it only writes on
# prereleases.
brews:
  - name: lfg
    repository:
      owner: ptmaroct
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/ptmaroct/lfg
    description: TUI bootstrap CLI for new dev machines
    license: MIT
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    test: |
      system "#{bin}/lfg", "version"
    install: |
      bin.install "lfg"

  - name: lfg-beta
    repository:
      owner: ptmaroct
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/ptmaroct/lfg
    description: TUI bootstrap CLI for new dev machines (beta channel)
    license: MIT
    # Only publish on prereleases. `IsSnapshot` covers `make release-snapshot`
    # so local dev never tries to push.
    skip_upload: '{{ if and (not .IsSnapshot) .Prerelease }}false{{ else }}true{{ end }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    test: |
      system "#{bin}/lfg", "version"
    install: |
      bin.install "lfg"
    # Caveat shown by `brew info lfg-beta`.
    caveats: |
      lfg-beta is the preview channel — expect rough edges.
      Stable lives at `brew install ptmaroct/tap/lfg`.

release:
  github:
    owner: ptmaroct
    name: lfg
  prerelease: auto
  draft: false
  # release-please creates the GitHub Release with the changelog body
  # before this workflow fires. `append` makes goreleaser upload its
  # archives + checksums to that existing release without overwriting
  # the body. `replace` would clobber release-please's changelog.
  mode: append
