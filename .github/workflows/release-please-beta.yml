# release-please drives prerelease (beta) releases on the develop branch.
#
# Mirrors release-please.yml but targets `develop` and uses the
# beta config so generated tags look like vX.Y.Z-beta.N. Merging the
# beta release PR triggers .github/workflows/release.yml which (because
# the tag is a prerelease) publishes the lfg-beta Homebrew formula in
# addition to the binaries.

name: release-please (beta)

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config-beta.json
          manifest-file: .release-please-manifest-beta.json
          target-branch: develop
          # See release-please.yml — release-please tags + creates the
          # GitHub Release body, goreleaser appends artifacts.
