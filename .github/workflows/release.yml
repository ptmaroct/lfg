# Releases lfg via goreleaser when a tag matching v* is pushed.
#
# Required secrets / permissions:
#   - GITHUB_TOKEN        provided automatically; needs `contents: write`
#   - HOMEBREW_TAP_TOKEN  PAT with `contents: write` on
#                         github.com/ptmaroct/homebrew-tap; goreleaser
#                         pushes the generated Formula/lfg.rb there.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
