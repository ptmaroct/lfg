# Releases lfg via goreleaser when a tag matching v* is pushed.
#
# Required secrets / permissions:
#   - GITHUB_TOKEN        provided automatically; needs `contents: write`
#   - HOMEBREW_TAP_TOKEN  PAT with `contents: write` on
#                         github.com/ptmaroct/homebrew-tap; goreleaser
#                         pushes the generated Formula/lfg.rb there.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Every external action below is pinned to a full commit SHA so a
      # rewritten tag (cf. tj-actions/changed-files, CVE-2025-30066)
      # can't silently redirect us to malicious code. Dependabot keeps
      # these SHAs updated via reviewed PRs; the human-readable tag
      # follows each SHA as a comment so we can spot stale pins.
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: set up go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: true

      - name: run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
