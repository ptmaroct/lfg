# Weekly preset bumper.
#
# Runs cmd/preset-bump every Monday at 06:00 UTC and opens a PR with
# any version changes that satisfy the 7-day quarantine window. The
# bot never merges — a human reviews the diff before any new pin
# reaches end users.
#
# Design constraints surfaced by the 2025–2026 npm + GitHub Actions
# supply-chain incident wave: dependencies are auto-bumped only AFTER
# they've aged past the typical malicious-release detection window
# (most poisoned packages are unpublished within hours, almost all
# within days). See docs/versioning.md.

name: preset-bump

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: set up go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: true

      - name: run preset-bump
        run: go run ./cmd/preset-bump --min-age-days=7

      - name: snapshot tests
        run: make test

      - name: open PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          title: "chore(preset): weekly version bump"
          commit-message: "chore(preset): weekly version bump"
          body: |
            Auto-generated by [`preset-bump`](../actions/workflows/preset-bump.yml).

            Every pin advanced here has been live on its registry for at least
            **7 days** (the quarantine window). Review the diff — any line
            tagged `⚠ install script CONTENT CHANGED` means the upstream
            curl-bash script's body shifted since our last sync; check the
            upstream commit log before merging.

            Merging this PR triggers `release-on-pins.yml` which cuts a patch
            release so downstream users pick up the new pins.
          branch: preset/auto-bump
          delete-branch: true
          labels: preset-bump,automated
