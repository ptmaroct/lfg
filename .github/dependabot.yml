# Dependabot keeps third-party GitHub Actions SHAs current — every
# uses: in .github/workflows/ is SHA-pinned to mitigate tag-rewrite
# attacks (cf. tj-actions/changed-files, CVE-2025-30066). Without
# Dependabot the SHAs would silently rot and we'd lose upstream fixes.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go
