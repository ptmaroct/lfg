[build]
  base    = "docs"
  command = "npm run build"
  publish = ".vitepress/dist"

[build.environment]
  NODE_VERSION = "22"

# VitePress generates one HTML per route — no SPA fallback needed.
# Cache hashed assets aggressively; HTML stays revalidatable so a
# new deploy is picked up on the next request.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
