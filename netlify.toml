[build]
  base    = "docs"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro generates one HTML per route — no SPA fallback needed.
# Cache hashed assets aggressively; HTML stays revalidatable so a
# new deploy is picked up on the next request.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
